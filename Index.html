<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Cam Mirror | Pikachu74</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: #111; padding: 20px; border-radius: 20px; border: 1px solid #333; }
        video { width: 100%; max-width: 400px; border-radius: 15px; margin-top: 15px; background: #222; }
        #qrcode { background: white; padding: 10px; display: inline-block; border-radius: 10px; margin: 20px 0; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; width: 100%; cursor: pointer; }
        .hidden { display: none; }
        .status { color: #00ff00; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Pikachu Mirror</h1>

        <div id="host-ui">
            <p>User 1: Click to start your camera</p>
            <button class="btn" onclick="initHost()">Start My Camera</button>
            <div id="qrcode" class="hidden"></div>
            <p id="id-label" class="hidden"></p>
            <video id="local-preview" autoplay playsinline muted></video>
        </div>

        <div id="viewer-ui" class="hidden">
            <div class="status">● Host Found!</div>
            <button class="btn" onclick="initViewer()">Watch Live Feed</button>
            <video id="remote-video" autoplay playsinline controls></video>
        </div>
    </div>

    <script>
        // 1. Setup Peer with Google Navigators (STUN)
        const peer = new Peer({
            config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
        });

        let myStream;
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('hostId');

        // Check if we are the Viewer (User 2)
        if (hostId) {
            document.getElementById('host-ui').classList.add('hidden');
            document.getElementById('viewer-ui').classList.remove('hidden');
        }

        // --- HOST LOGIC ---
        async function initHost() {
            try {
                // We use CAMERA only for maximum compatibility
                myStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                document.getElementById('local-preview').srcObject = myStream;
                
                peer.on('open', (id) => {
                    const shareUrl = window.location.origin + window.location.pathname + '?hostId=' + id;
                    document.getElementById('qrcode').classList.remove('hidden');
                    document.getElementById('id-label').innerText = "ID: " + id;
                    new QRCode(document.getElementById("qrcode"), shareUrl);
                });

                // Answer calls
                peer.on('call', (call) => {
                    call.answer(myStream);
                });

            } catch (err) {
                alert("Camera Error: " + err.message);
            }
        }

        // --- VIEWER LOGIC ---
        function initViewer() {
            const call = peer.call(hostId, null);
            const video = document.getElementById('remote-video');

            call.on('stream', (stream) => {
                video.srcObject = stream;
                // Important: Try to play automatically
                video.play().catch(() => {
                    console.log("Play button needed");
                });
            });
        }
    </script>
</body>
</html>
